# 정적 산출물 서빙 (001 T041).
#
# 이 파일은 서버 블록 하나만 담는다. 기본 이미지의 /etc/nginx/nginx.conf 가
# conf.d/*.conf 를 include 하므로 그 자리에 놓는다.
#
# 8080 을 듣는 이유: 비루트로 돌리기 때문이다. 1024 미만 포트는 특권이 필요하다.
# 밖에서는 Service 가 80 으로 받아 8080 으로 넘긴다(deploy/k8s/50-web.yaml).

# ── 접근 로그 ──
# JSON 으로 찍는다. Alloy 가 stdout 을 그대로 Loki 로 보내므로 LogQL 에서 `| json` 한 번에
# 필드가 열린다(R-9). 정규식 파싱보다 형식이 바뀌었을 때 조용히 어긋날 여지가 적다.
#
# escape=json 이 없으면 방문자가 보낸 User-Agent 안의 따옴표 하나로 줄 전체가 깨진다.
log_format json_access escape=json
  '{'
  '"time":"$time_iso8601",'
  '"remote_addr":"$remote_addr",'
  '"method":"$request_method",'
  '"path":"$uri",'
  '"query":"$args",'
  '"status":$status,'
  '"bytes":$body_bytes_sent,'
  '"duration":$request_time,'
  '"referer":"$http_referer",'
  '"user_agent":"$http_user_agent"'
  '}';

# ── 캐시 정책을 한 곳에서 정한다 ──
#
# location 마다 add_header 를 쓰지 않는 이유가 있다. nginx 의 add_header 는 **자식 블록에
# add_header 가 하나라도 있으면 부모 것을 전부 버린다.** 실제로 그래서 /_next/static/ 과
# /fonts/ 응답에서 보안 헤더 셋이 통째로 사라졌다 — 조용히, 아무 경고 없이.
#
# 그래서 값만 map 으로 고르고 add_header 는 server 블록에 한 번만 둔다.
# expires 지시자도 쓰지 않는다. 그것이 Cache-Control 을 하나 더 붙여 헤더가 두 줄이 된다.
map $uri $cache_control {
  # HTML 은 캐시하지 않는다. 자산 해시가 바뀌었는데 옛 HTML 이 남아 있으면 없는 파일을 부른다.
  default 'no-cache';
  # 해시가 붙은 자산은 내용이 바뀌면 이름이 바뀐다. 영구 캐시해도 안전하다.
  '~^/_next/static/' 'public, max-age=31536000, immutable';
  # 서브셋 글꼴은 이름이 고정이라 내용이 바뀔 수 있다. 다만 바뀌는 때는 글자가 네모로
  # 보이는 때뿐이라 하루면 충분하다.
  '~^/fonts/' 'public, max-age=86400';
}

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  # index 지시자를 쓰지 않는다. `/` 요청에 그것이 붙으면 $uri 가 `//index.html` 이 되어
  # 로그의 경로가 어긋난다 — 대시보드에서 방 화면이 두 갈래로 갈린다.
  # 아래 `location = /` 가 같은 일을 하면서 $uri 를 /index.html 로 남긴다.

  access_log /dev/stdout json_access;
  error_log /dev/stderr warn;

  # 헤더는 여기 한 번만. 아래 location 들에는 add_header 를 두지 않는다(위 map 주석 참조).
  add_header Cache-Control $cache_control always;
  add_header X-Content-Type-Options 'nosniff' always;
  add_header Referrer-Policy 'strict-origin-when-cross-origin' always;
  add_header X-Frame-Options 'DENY' always;

  # Content-Security-Policy 는 아직 두지 않는다. layout.tsx 가 첫 페인트 전에 보기 방식을
  # 적용하려고 인라인 <script> 를 하나 넣는데, 엄격한 CSP 는 그것을 막는다. nonce 나 해시를
  # 붙이는 작업이 먼저이고, 실제 배포 뒤 확인하며 하는 편이 안전하다.

  location = / {
    try_files /index.html =404;
  }

  # 정적 export 는 /admin 을 admin.html 로 뽑는다(next.config.mjs 의 trailingSlash: false).
  # $uri.html 이 없으면 /admin 이 404 다.
  #
  # SPA 폴백(/index.html)을 쓰지 않는다. 없는 주소에 방 화면을 200 으로 돌려주면
  # 검색엔진이 그것을 실제 문서로 색인한다.
  location / {
    try_files $uri $uri.html $uri/index.html =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }

  # 프로브용. 10초마다 찍히면 진짜 방문이 로그에 묻힌다.
  # add_header 를 두지 않아 위의 헤더가 그대로 상속된다.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # 자산은 로그에 남기지 않는다. 한 번 방문에 수십 줄이 쌓여 경로별 집계가 무의미해진다.
  location /_next/static/ {
    access_log off;
  }

  location /fonts/ {
    access_log off;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
  # woff2 는 이미 압축돼 있어 다시 압축하면 CPU 만 쓴다.
}
