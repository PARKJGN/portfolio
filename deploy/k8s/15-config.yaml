# 비밀이 아닌 설정값. 자유롭게 커밋한다.
#
# 키 이름은 **API 가 실제로 읽는 환경변수 이름 그대로**다(api/src/config.ts). Deployment 가
# envFrom 으로 통째로 넣으므로, 여기서 이름을 예쁘게 바꾸면 앱이 그 값을 못 찾는다.
# 무엇을 하는 값인지는 api/.env.example 에 설명과 함께 있다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: portfolio-config
  namespace: portfolio
data:
  NODE_ENV: 'production'
  PORT: '8080'

  # 브라우저에서 이 API 를 부를 수 있는 출처. 운영은 사이트 도메인 하나뿐이다 —
  # 같은 도메인의 /api 로 들어오므로 평소에는 쓰이지 않지만, 틀리면 방명록만 조용히
  # 죽으므로 정확히 적는다.
  ALLOWED_ORIGIN: 'https://portfolio.jgbak-land.com'

  # ── 데이터베이스 ──
  # oneBite 인스턴스를 공유하되 롤과 데이터베이스는 분리한다(research.md R-6).
  # 네임스페이스를 건너가는 접속이라 FQDN 을 쓴다.
  #
  # ⚠ portfolio 롤과 데이터베이스는 **수동으로 만들어야 한다.** 그 파드의 초기화
  #   스크립트(/docker-entrypoint-initdb.d)는 데이터 디렉터리가 빈 최초 기동에서만 돌기
  #   때문에, ConfigMap 에 CREATE ROLE 을 넣어도 실행되지 않는다. 절차는
  #   specs/003-guestbook/quickstart.md 준비 1단계.
  PGHOST: 'postgres.onebite.svc.cluster.local'
  PGPORT: '5432'
  PGDATABASE: 'portfolio'
  PGUSER: 'portfolio'

  # ── 유해성 판정 ──
  # 이 시간 안에 답이 없으면 기다리지 않고 보류로 처리해 응답한다(FR-013 · SC-002).
  # 방문자를 기다리게 하지 않는 것이 계약이다.
  VERDICT_TIMEOUT_MS: '4000'

  # ── 남용 방지 ──
  # 시간당 한도(데이터베이스가 센다 — 재시작해도 유지된다).
  RATE_LIMIT_WINDOW_MS: '3600000'
  RATE_LIMIT_MAX: '5'
  # 순간 폭주 막이(메모리가 센다 — 분당 횟수, 목록 조회 포함).
  BURST_LIMIT_MAX: '30'
