# 시크릿 템플릿.
#
#   cp 10-secret.example.yaml 10-secret.yaml   → 값 채우기 → kubectl apply -f 10-secret.yaml
#
# **실값이 든 10-secret.yaml 은 절대 커밋하지 않는다.** .gitignore 에 이미 들어 있다.
# 저장소에 남는 것은 이 예시 파일 하나뿐이어야 한다(헌장 기술 제약).
#
# 키 이름은 API 가 실제로 읽는 환경변수 이름 그대로다(api/src/config.ts). Deployment 가
# envFrom 으로 통째로 넣는다.
apiVersion: v1
kind: Secret
metadata:
  name: portfolio-secrets
  namespace: portfolio
type: Opaque
stringData:
  # ── 데이터베이스 ──
  # oneBite 인스턴스의 portfolio 롤 비밀번호. onebite 롤과 다른 값을 쓴다 —
  # 계정을 나눈 이유가 사라진다.
  #   openssl rand -base64 24
  PGPASSWORD: ''

  # ── 유해성 판정 ──
  # 이 키가 없거나 호출이 실패하면 글은 공개되지 않고 전부 보류로 간다. 실수가 아니라
  # 설계다(FR-013) — 다만 보류함이 금방 찰 테니, 비워 두고 배포하지는 말 것.
  ANTHROPIC_API_KEY: ''

  # ── 주인 ──
  # 보류함 조회·공개·삭제에 쓴다. 32자 미만이면 API 가 기동을 거부한다.
  #   openssl rand -hex 32
  ADMIN_TOKEN: ''

  # ── 남용 방지 ──
  # 접속 식별값을 해시할 때 섞는 소금. 이것이 없으면 IPv4 주소 공간은 43억 개뿐이라
  # 해시를 전부 만들어 맞춰 볼 수 있다 — 소금이 있어야 해시가 익명화가 된다(FR-020).
  # 32자 미만이면 API 가 기동을 거부한다.
  #   openssl rand -hex 32
  CLIENT_HASH_SALT: ''
