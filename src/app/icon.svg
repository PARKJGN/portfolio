<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="펼친 책">
  <!--
    파비콘 — 펼친 책. 이 사이트가 하는 일 그대로다.

    16px 에서 읽히는 것이 유일한 기준이라 형태를 둘로만 줄였다: 붉은 바탕과 종이 두 장.
    책등 두께나 제목 줄을 넣으면 그 크기에서 뭉개져 붉은 얼룩이 된다 — 실제로 책 한
    권을 세워 그려 봤더니 16px 에서 그냥 붉은 사각형이었다.

    바탕을 채운다. 투명하게 두면 어두운 탭에서 종이가 검은 바탕에 떠 대비가 무너진다.
    붉은색을 고른 이유는 대비가 가장 세고(종이와 5.99:1) 서가에서 가장 눈에 띄는 책이
    이 색이어서다 — spine-crimson-bg. 종이는 spine-crimson-fg 를 그대로 쓴다.

    Next 의 app/icon.svg 규약이라 <link rel="icon"> 은 자동으로 붙는다. 직접 쓰지 않는다.
  -->
  <rect width="32" height="32" rx="7" fill="#ae1800" />
  <path d="M5 10c3-1.4 7.5-1.4 10.4.6v12.8C12.5 21.4 8 21.4 5 22.8z" fill="#f3ead5" />
  <path d="M27 10c-3-1.4-7.5-1.4-10.4.6v12.8c2.9-2 7.4-2 10.4-.6z" fill="#f3ead5" />
</svg>
